name: Build and Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/dynambo-api:latest \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/dynambo-api:latest


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            echo "Pulling latest Docker image..."

            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/dynambo-api:latest

            echo "Stopping old container..."
            sudo docker stop dynambo-api || true

            echo "Removing old container..."
            sudo docker rm dynambo-api || true

            echo "Starting new container..."

            sudo docker run -d \
              --name dynambo-api \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file ~/.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/dynambo-api:latest

            echo "Removing unused images..."
            sudo docker image prune -f

            echo "Deployment completed!"

            echo "Running containers:"
            sudo docker ps